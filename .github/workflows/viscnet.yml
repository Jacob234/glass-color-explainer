name: ViscNet

# Runs GlassPy's ViscNet (GPL-3.0-or-later) on the fragility section's glasses and commits the
# numbers in public/data/viscnet.json back to the branch. Runs here because GlassPy fetches its
# weights from Zenodo, which the project's cloud sandbox cannot reach. Only the numbers are kept.

on:
  push:
    branches-ignore: [main]
    paths:
      - tools/fragility/viscnet.py
      - public/data/sciglass/fragility.json
      - src/data/batch.json
      - .github/workflows/viscnet.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to start CI on the commit it pushes, which GITHUB_TOKEN pushes would not trigger

concurrency:
  group: viscnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GlassPy (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install glasspy==0.6.0
      - name: Predict
        run: python3 tools/fragility/viscnet.py public/data/viscnet.json
      - uses: actions/upload-artifact@v4
        with:
          name: viscnet
          path: public/data/viscnet.json
      - name: Commit the numbers to the branch
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/viscnet.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Update ViscNet predictions (tools/fragility/viscnet.py)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
